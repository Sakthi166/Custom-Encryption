<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #dad7cd;
        }

        header {
            background-color: #588157;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header .logo h1 {
            margin: 0;
            font-size: 24px;
        }

        header nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        header nav ul li {
            margin-left: 20px;
        }

        header nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        section {
            padding: 50px 20px;
            text-align: center;
        }

        .intro h2 {
            font-size: 36px;
            color: #344e41;
        }

        .intro p {
            font-size: 18px;
            color: #3a5a40;
        }

        .contact-form {
            background-color: #ffffff;
            padding: 50px 20px;
            border-radius: 8px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .contact-form h2 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #344e41;
        }

        .contact-form label {
            display: block;
            margin-bottom: 10px;
            font-size: 16px;
            color: #3a5a40;
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            width: 270px;
            height: 80px;
            border: none;
            outline: none;
            background: #2f2f2f;
            color: #fff;
            font-size: 22px;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 6px 20px -5px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .check-box {
            width: 80px;
            height: 80px;
            border-radius: 40px;
            box-shadow: 0 0 12px -2px rgba(0, 0, 0, 0.5);
            position: absolute;
            top: 0;
            right: -40px;
            opacity: 0;
        }

        .check-box svg {
            width: 40px;
            margin: 20px;
        }

        svg path {
            stroke-width: 3;
            stroke: #fff;
            stroke-dasharray: 34;
            stroke-dashoffset: 34;
            stroke-linecap: round;
        }

        .active {
            background: #ff2b75;
            transition: 1s;
        }

        .active .check-box {
            right: 0;
            opacity: 1;
            transition: 1s;
        }

        .active p {
            margin-right: 125px;
            transition: 1s;
        }

        .active svg path {
            stroke-dashoffset: 0;
            transition: 1s;
            transition-delay: 1s;
        }

        footer {
            background-color: #344e41;
            color: white;
            text-align: center;
            padding: 5px;
            position: fixed;
            bottom: 0;
            width: 100%;
            max-height: 30px;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
        
    <section class="intro">
        <h2>Contact Us</h2>
        <p>We'd love to hear from you! Fill out the form below to get in touch.</p>
    </section>

    <section class="contact-form">
        <form action="https://api.web3forms.com/submit" method="POST">
            <h2>Send a Message</h2>
            <input type="hidden" name="access_key" value="f4883122-bb81-4bc9-9e26-af76b6d7eaad">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
    
            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
    
            <label for="message">Your Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Write your message" required></textarea>
    
            <div class="container">
                <button id="btn" type="submit">
                    <p id="btnText">Submit</p>
                    <div class="check-box">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50">
                            <path fill="transparent" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
                        </svg>
                    </div>
                </button>
            </div>
        </form>
    </section>
    
    <footer>
        <p>&copy; 2025 ReconXpert. All Rights Reserved.</p>
    </footer>

    <script>
        const btn = document.querySelector("#btn");
        const btnText = document.querySelector("#btnText");

        btn.onclick = () => {
            btnText.innerHTML = "Thanks";
            btn.classList.add("active");
        };

        function showPopup(event) {
            event.preventDefault(); // Prevent actual form submission
            alert("Thank you for your message! We'll get back to you soon.");
        }
    </script>
</body>
</html>
